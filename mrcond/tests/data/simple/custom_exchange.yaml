collections:
- watched:
    db_name: test
    coll_name: testcoll
    change_stream_pre_and_post_images: false
  resume_tokens:
    tokens_db_name: test
    tokens_coll_name: resume_tokens
    tokens_coll_capped: true
    tokens_coll_size_in_bytes: 1048576
  rabbitmq:
    exchange_name: testexchange
    exchange:
      name: my_exchange
      type: direct
      declare_options:
        passive: false
        durable: false
        auto_delete: false
        internal: false
        nowait: false
    queue:
      name: "testqueue"
      bind_options:
        nowait: false
      declare_options:
        passive: false
        durable: false
        exclusive: false
        auto_delete: false
        nowait: false
      basic_publish_options:
        mandatory: false
        immediate: false
    routing_key: "test_routing_key"
    publish_options:
      persistent: false
      content_type: "application/json"
      content_encoding: "utf-8"
      priority: 0
      correlation_id: ""
      reply_to: ""
      expiration: ""
      message_id: ""
      timestamp: 0
      user_id: ""
      app_id: ""
      cluster_id: ""